name: 전시 사이트 만들기

# zip 을 올리거나(inbox/), 릴리스에 zip 을 첨부하면 자동으로 사이트를 다시 만든다.
on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: 릴리스에 첨부된 zip 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .inbox-release
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r tag; do
            gh release download "$tag" --pattern '*.zip' --dir ".inbox-release/$tag" || true
          done
      - name: 사이트 만들기
        run: python tools/build.py | tee build.log
      - name: 확인할 것 요약
        if: always()
        run: |
          {
            echo '## 빌드 결과'
            echo '```'
            sed -n '/^\[/,$p' build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
